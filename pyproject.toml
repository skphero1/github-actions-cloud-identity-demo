[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-cloud-identity-demo"
version = "0.1.0"
description = "GitHub Actions to AWS OIDC workload identity demo with an offline Python 3.12 JWT verifier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "PyJWT[crypto]>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
oidc-demo = "oidc_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["oidc_verifier*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
